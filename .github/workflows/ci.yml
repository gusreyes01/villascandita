name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENPAY_MERCHANT_ID: ci_merchant
      OPENPAY_PRIVATE_KEY: sk_ci_placeholder
      PAYMENT_SIGNING_SECRET: ci-only-signing-secret-at-least-32-characters
      APP_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_OPENPAY_MERCHANT_ID: ci_merchant
      NEXT_PUBLIC_OPENPAY_PUBLIC_KEY: pk_ci_placeholder
      NEXT_PUBLIC_OPENPAY_SANDBOX: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
